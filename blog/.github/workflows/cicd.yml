name: CI/CD Pipeline

on:
  push:
    branches:
      - "김민지/main"
      - "김민지/8주차"
  pull_request:
    branches: [ "김민지/main" ]
  workflow_dispatch:

jobs:
  # 1. 테스트 및 빌드 작업
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Secret에 넣어둔 application.yml을 생성하는 단계
      - name: Restore application.yml
        run: |
          mkdir -p ./blog/src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" | base64 --decode > ./blog/src/main/resources/application.yml

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: blog/build/libs/*.jar

  # 2. 도커 이미지 빌드 및 Push 작업
  docker-push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # application.yml이 이미지 빌드에 필요하므로 다시 생성
      - name: Restore application.yml
        run: |
          mkdir -p ./blog/src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" | base64 --decode > ./blog/src/main/resources/application.yml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./blog
          file: ./blog/Dockerfile
          push: true
          tags: sxvxnxwt/leets-blog:latest

  # 3. EC2 배포 작업
  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml 파일을 EC2로 복사
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "blog/docker-compose.yml"
          target: "/home/ubuntu/"

      # SSH로 접속하여 배포 명령 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu
            sudo docker-compose down || true
            sudo docker-compose pull
            sudo docker-compose up -d